name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test
        run: pytest -q
      - name: Tool spec is up to date
        run: |
          zoho-inventory-mcp export-spec --out docs/tool-spec.json
          git diff --exit-code docs/tool-spec.json
      - name: End-to-end demo (stdio MCP server against mock Zoho)
        run: python scripts/demo.py
